services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../../backend
      dockerfile: Grimorio.API/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}
      DATA_PROTECTION_KEYS_PATH: ${DATA_PROTECTION_KEYS_PATH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GRIMORIO_ADMIN_EMAIL: ${GRIMORIO_ADMIN_EMAIL}
      GRIMORIO_ADMIN_PASSWORD: ${GRIMORIO_ADMIN_PASSWORD}
      Alexa__KitchenCommandKey: ${ALEXA_KITCHEN_COMMAND_KEY}
      LoyaltyWhatsApp__Enabled: ${LOYALTY_WHATSAPP_ENABLED:-false}
      LoyaltyWhatsApp__Mode: ${LOYALTY_WHATSAPP_MODE:-Production}
      LoyaltyWhatsApp__PublicBranchId: ${LOYALTY_WHATSAPP_BRANCH_ID:-00000000-0000-0000-0000-000000000000}
      LoyaltyWhatsApp__TestPhoneNumberId: ${LOYALTY_WHATSAPP_TEST_PHONE_NUMBER_ID:-}
      LoyaltyWhatsApp__PhoneNumberId: ${LOYALTY_WHATSAPP_PHONE_NUMBER_ID:-}
      LoyaltyWhatsApp__BusinessAccountId: ${LOYALTY_WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      LoyaltyWhatsApp__BusinessPhone: ${LOYALTY_WHATSAPP_BUSINESS_PHONE:-}
      LoyaltyWhatsApp__MetaAppId: ${LOYALTY_WHATSAPP_META_APP_ID:-}
      LoyaltyWhatsApp__PublicAppUrl: ${VITE_PUBLIC_APP_URL}
      LoyaltyWhatsApp__ErpAppUrl: ${VITE_ERP_APP_URL}
      LoyaltyWhatsApp__AccessToken: ${LOYALTY_WHATSAPP_ACCESS_TOKEN:-}
      LoyaltyWhatsApp__AuthenticationTemplate: ${LOYALTY_WHATSAPP_AUTHENTICATION_TEMPLATE:-}
      LoyaltyWhatsApp__TemplateLanguage: ${LOYALTY_WHATSAPP_TEMPLATE_LANGUAGE:-es}
      LoyaltyWhatsApp__GraphVersion: ${LOYALTY_WHATSAPP_GRAPH_VERSION:-v25.0}
      LoyaltyWhatsApp__RestrictRecipients: ${LOYALTY_WHATSAPP_RESTRICT_RECIPIENTS:-true}
      LoyaltyWhatsApp__AllowedTestPhones__0: ${LOYALTY_WHATSAPP_ALLOWED_PHONE_1:-}
      LoyaltyWhatsApp__AllowedTestPhones__1: ${LOYALTY_WHATSAPP_ALLOWED_PHONE_2:-}
      LoyaltyWhatsApp__DailySendLimit: ${LOYALTY_WHATSAPP_DAILY_SEND_LIMIT:-100}
      LoyaltyWhatsApp__BusinessAppCoexistenceConfirmed: ${LOYALTY_WHATSAPP_COEXISTENCE_CONFIRMED:-false}
      LoyaltyWhatsApp__CodeHashKey: ${LOYALTY_WHATSAPP_CODE_HASH_KEY:-}
      LoyaltyWhatsApp__WebhookVerifyToken: ${LOYALTY_WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      LoyaltyWhatsApp__AppSecret: ${LOYALTY_WHATSAPP_APP_SECRET:-}
    volumes:
      - ../../backend/secrets:/app/secrets:ro
      - data_protection_keys:/app/keys
      - api_logs:/app/logs
      - api_uploads:/app/wwwroot/uploads
      - responsibility_evidence:/app/private/responsibilities
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL}
        VITE_ERP_APP_URL: ${VITE_ERP_APP_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      PUBLIC_WWW_DOMAIN: ${PUBLIC_WWW_DOMAIN:?Set PUBLIC_WWW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  responsibility_evidence:
  postgres_data:
  api_logs:
  api_uploads:
  data_protection_keys:
  caddy_data:
  caddy_config:
